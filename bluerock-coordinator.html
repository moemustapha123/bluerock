// ─── ICAL ─────────────────────────────────────────────────────────────────────
function parseIcal(text) {
  const events = []; const re = /BEGIN:VEVENT([\s\S]*?)END:VEVENT/g; let m;
  while ((m = re.exec(text)) !== null) {
    const b = m[1];
    const ds = b.match(/DTSTART(?:;[^\r\n:]*)?:(\d{8})/)?.[1];
    const de = b.match(/DTEND(?:;[^\r\n:]*)?:(\d{8})/)?.[1];
    const uid = b.match(/UID:([^\r\n]+)/)?.[1]?.trim();
    if (ds && de) {
      const fmt = d => `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
      const start = fmt(ds), end = fmt(de);
      const nights = Math.round((new Date(end) - new Date(start)) / 86400000);
      events.push({ start, end, nights, uid: uid || `${ds}_${de}` });
    }
  }
  return events.sort((a,b) => a.start.localeCompare(b.start));
}
async function fetchIcal(url) {
  // 1. Direct (works only if server allows CORS)
  try { const r = await fetch(url, {mode:"cors"}); if (r.ok) { const t = await r.text(); if (t.includes("BEGIN:VCALENDAR")) return t; } } catch {}
  // 2. corsproxy.io
  try {
    const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    if (r.ok) { const t = await r.text(); if (t.includes("BEGIN:VCALENDAR")) return t; }
  } catch {}
  // 3. allorigins.win
  try {
    const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
    if (r.ok) { const d = await r.json(); if (d.contents && d.contents.includes("BEGIN:VCALENDAR")) return d.contents; }
  } catch {}
  // 4. thingproxy.freeboard.io
  try {
    const r = await fetch(`https://thingproxy.freeboard.io/fetch/${url}`);
    if (r.ok) { const t = await r.text(); if (t.includes("BEGIN:VCALENDAR")) return t; }
  } catch {}
  // 5. api.codetabs.com
  try {
    const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`);
    if (r.ok) { const t = await r.text(); if (t.includes("BEGIN:VCALENDAR")) return t; }
  } catch {}
  return null;
}

// ─── IMAGE COMPRESSION ───────────────────────────────────────────────────────
async function compressImage(file, maxDim=1200, quality=0.75) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        res(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ─── PASSWORD HASHING (PBKDF2 via Web Crypto) ────────────────────────────────
async function hashPassword(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key  = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"}, key, 256);
  const toHex = buf => Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  return `pbkdf2:${toHex(salt.buffer)}:${toHex(bits)}`;
}
async function verifyPassword(password, stored) {
  if (!stored || !stored.startsWith("pbkdf2:")) return false;
  const [,saltHex,hashHex] = stored.split(":");
  const salt = new Uint8Array(saltHex.match(/.{2}/g).map(b=>parseInt(b,16)));
  const key  = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"}, key, 256);
  const computed = Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,"0")).join("");
  return computed === hashHex;
}

// ─── TURNOVER TIMER HELPERS ───────────────────────────────────────────────────
const pad2 = n => String(n).padStart(2,"0");

function parseWindowTime(dateStr, timeStr) {
  if (!dateStr || !timeStr) return null;
  const m = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return null;
  let h = parseInt(m[1]), min = parseInt(m[2]);
  const ampm = m[3].toUpperCase();
  if (ampm==="PM" && h!==12) h+=12;
  if (ampm==="AM" && h===12) h=0;
  const [y,mo,d] = dateStr.split("-").map(Number);
  return new Date(y, mo-1, d, h, min, 0).getTime();
}

function fmtWindowDuration(ms) {
  if (!ms||ms<=0) return "";
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return h>0 ? `${h}h ${m>0?m+"m ":""}` : `${m}m `;
}

function LoginScreen({onLogin,onGoSignup}) {
  const db = useContext(DbCtx);
  const [email,setEmail]=useState(""); const [pass,setPass]=useState(""); const [err,setErr]=useState("");
  const handle = async () => {
    const snap = await db.ref("accounts").orderByChild("email").equalTo(email.trim().toLowerCase()).once("value");
    const accounts = Object.values(snap.val()||{});
    let acc = null;
    for (const a of accounts) {
      const hashed = a.password?.startsWith("pbkdf2:");
      if (hashed) {
        if (await verifyPassword(pass, a.password)) { acc = a; break; }
      } else if (a.password === pass) {
        // Plain-text legacy account — verify then migrate to hash
        acc = a;
        const newHash = await hashPassword(pass);
        await db.ref(`accounts/${a.id}/password`).set(newHash);
        break;
      }
    }
    if (!acc) { setErr("Incorrect email or password."); return; }
    onLogin(acc);
  };
  return <AuthShell>
    <h2 style={{fontFamily:DISPLAY,fontSize:24,color:COLORS.navy,marginBottom:6}}>Welcome back</h2>
    <p style={{fontSize:13,color:COLORS.slate,marginBottom:24}}>Sign in to your account</p>
    <ErrBox msg={err}/>
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <FieldInput label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" onKeyDown={e=>e.key==="Enter"&&handle()}/>
      <FieldInput label="Password" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&handle()}/>
    </div>
    <Btn onClick={handle} style={{width:"100%",justifyContent:"center",marginTop:20}}>Sign In</Btn>
    <div style={{textAlign:"center",marginTop:16,fontSize:13,color:COLORS.slate}}>
      Don't have an account?{" "}<span onClick={onGoSignup} style={{color:COLORS.blue,fontWeight:600,cursor:"pointer"}}>Create one</span>
    </div>
  </AuthShell>;
}

    if (!name.trim()||!email.trim()||!pass||!role){setErr("Please fill in all fields.");return;}
    if (pass!==confirm){setErr("Passwords do not match.");return;}
    if (pass.length<6){setErr("Password must be at least 6 characters.");return;}

// ─── CALENDAR VIEW ────────────────────────────────────────────────────────────
function CalendarView({stays,jobs,properties,accounts,currentUser,readOnly}) {
  const db = useContext(DbCtx);
  const [addOpen,setAddOpen]     = useState(false);
  const [editProp,setEditProp]   = useState(null);
  const [syncing,setSyncing]     = useState({});
  const [syncRes,setSyncRes]     = useState({});
  const [pasteText,setPasteText] = useState({});

  // Sort stays newest first for display, split upcoming vs past
  const staysByProp = propId => {
    const s = stays.filter(s=>s.propId===propId);
    s.sort((a,b)=>a.start.localeCompare(b.start));
    return s;
  };
  const jobForStay = (stay) => jobs.find(j=>j.propertyId===stay.propId && j.checkoutDate===stay.end);

  const doSync = async (prop, rawText) => {
    setSyncing(v=>({...v,[prop.id]:true}));
    setSyncRes(v=>({...v,[prop.id]:null}));
    try {
      let text = rawText;
      if (!text && prop.icalUrl) text = await fetchIcal(prop.icalUrl);
      if (!text) throw new Error("Could not fetch calendar via any proxy. Airbnb may be blocking automated requests — use the \"Paste iCal content\" option below instead.");
      const events = parseIcal(text);
      if (events.length===0) throw new Error("No bookings found in this calendar.");

      // Save stays to Firebase
      const staysRef = db.ref(`stays/${prop.id}`);
      const staysSnap = await staysRef.once("value");
      const existing = staysSnap.val()||{};
      let added=0;
      for (const ev of events) {
        const k = safeKey(ev.uid);
        const stayData = {uid:ev.uid,start:ev.start,end:ev.end,nights:ev.nights,propId:prop.id};
        await staysRef.child(k).set(stayData);
        // Create cleaning job for each checkout date
        const jobId = `ical_${prop.id}_${k}`;
        const existingJob = await db.ref(`jobs/${jobId}`).once("value");
        if (!existingJob.val()) {
          // Find next stay for checkin date
          const sorted = events.slice().sort((a,b)=>a.start.localeCompare(b.start));
          const idx = sorted.findIndex(e=>e.uid===ev.uid);
          const nextCheckin = sorted[idx+1]?.start || null;
          const wStart = parseWindowTime(ev.end,       prop.checkoutTime||"11:00 AM");
          const wEnd   = parseWindowTime(nextCheckin,  prop.checkinTime ||"3:00 PM");
          await db.ref(`jobs/${jobId}`).set({id:jobId,propertyId:prop.id,checkoutDate:ev.end,checkinDate:nextCheckin,status:"pending",cleaner:null,arrivedAt:null,completedAt:null,photos:0,windowStart:wStart||null,windowEnd:wEnd||null,overdueAlertSent:false});
          added++;
        }
      }
      await db.ref(`properties/${prop.id}`).update({lastSynced:new Date().toISOString()});
      setSyncRes(v=>({...v,[prop.id]:{ok:true,msg:`✓ Synced — ${added} new job${added!==1?"s":""} added (${events.length} bookings total)`}}));
    } catch(e) {
      setSyncRes(v=>({...v,[prop.id]:{ok:false,msg:`✗ ${e.message}`}}));
    }
    setSyncing(v=>({...v,[prop.id]:false}));
  };

  const deleteProp = async id => {
    if (!confirm("Delete this property and all its data?")) return;
    await db.ref(`properties/${id}`).remove();
    await db.ref(`stays/${id}`).remove();
    const jobsSnap = await db.ref("jobs").orderByChild("propertyId").equalTo(id).once("value");
    const jobKeys = Object.keys(jobsSnap.val()||{});
    await Promise.all(jobKeys.map(k=>db.ref(`jobs/${k}`).remove()));
    await db.ref(`inventory/${id}`).remove();
  };

  const cleaners = accounts.filter(a=>a.authorized&&(a.role==="cleaner"||a.role==="manager"||a.role==="owner")).map(a=>a.name);

  return <div>
    {!readOnly&&<AddPropertyModal open={addOpen} onClose={()=>setAddOpen(false)} properties={properties} onSync={doSync}/>}
    {editProp&&<EditPropertyModal prop={editProp} onClose={()=>setEditProp(null)}/>}

    {!readOnly&&<div style={{marginBottom:24}}>
      <Btn onClick={()=>setAddOpen(true)}>➕ Add Property</Btn>
    </div>}

    {properties.length===0?<Card style={{textAlign:"center",padding:40}}>
      <div style={{fontSize:36,marginBottom:12}}>🏠</div>
      <div style={{fontWeight:700,fontSize:16,color:COLORS.navy,marginBottom:6}}>No properties yet</div>
      <div style={{fontSize:13,color:COLORS.slate}}>{readOnly?"No properties have been added yet. Ask an owner to sync the Airbnb calendar.":"Click \"Add Property\" above to paste your Airbnb iCal link."}</div>
    </Card>:properties.map(prop=>{
      const propStays = staysByProp(prop.id);
      const upcoming  = propStays.filter(s=>stayStatus(s)!=="past");
      const past      = propStays.filter(s=>stayStatus(s)==="past").slice(-3); // last 3

      return <div key={prop.id} style={{marginBottom:32}}>
        {/* Property header */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
          <div style={{width:14,height:14,borderRadius:"50%",background:prop.color,flexShrink:0}}/>
          <h3 style={{fontSize:16,fontWeight:800,color:COLORS.navy,fontFamily:DISPLAY,margin:0}}>{prop.name}</h3>
          {prop.address&&<span style={{fontSize:12,color:COLORS.slate}}>{prop.address}</span>}
          {prop.lastSynced&&<span style={{fontSize:11,color:COLORS.slate}}>· Synced {new Date(prop.lastSynced).toLocaleString()}</span>}
          <div style={{flex:1}}/>
          {!readOnly&&<>
            <Btn small variant="outline" disabled={syncing[prop.id]} onClick={()=>doSync(prop,null)}>
              {syncing[prop.id]?"⏳":"🔄"} {syncing[prop.id]?"Syncing…":"Re-sync"}
            </Btn>
            <Btn small variant="ghost" onClick={()=>setEditProp(prop)}>✏️ Edit</Btn>
            <Btn small variant="red" onClick={()=>deleteProp(prop.id)}>🗑</Btn>
          </>}
        </div>
        {syncRes[prop.id]&&<div style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:600,color:syncRes[prop.id].ok?COLORS.green:COLORS.red,marginBottom:syncRes[prop.id].ok?0:8}}>{syncRes[prop.id].msg}</div>
          {!syncRes[prop.id].ok&&<div>
            <div style={{fontSize:11,color:COLORS.slate,marginBottom:4}}>Paste the iCal content manually to sync:</div>
            <textarea value={pasteText[prop.id]||""} onChange={e=>setPasteText(v=>({...v,[prop.id]:e.target.value}))}
              placeholder="Open your Airbnb calendar link in a browser, copy all the text, and paste it here…"
              style={{width:"100%",height:80,padding:"8px 10px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:"monospace",fontSize:11,resize:"vertical",boxSizing:"border-box",display:"block",marginBottom:6}}/>
            <Btn small onClick={()=>{ if(pasteText[prop.id]?.trim()) doSync(prop, pasteText[prop.id].trim()); }}
              disabled={!pasteText[prop.id]?.trim()}>Sync from Paste</Btn>
          </div>}
        </div>}

        {/* Upcoming stays */}
        {upcoming.length>0&&<>
          <div style={{fontSize:12,fontWeight:700,color:COLORS.slate,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Upcoming & Active</div>
          {upcoming.map(s=><StayCard key={s.uid} stay={s} prop={prop} job={jobForStay(s)} readOnly={readOnly} currentUser={currentUser}/>)}
        </>}

        {/* Past stays */}
        {past.length>0&&<>
          <div style={{fontSize:12,fontWeight:700,color:COLORS.slate,textTransform:"uppercase",letterSpacing:1,marginBottom:8,marginTop:14}}>Recent Past (last 3)</div>
          {past.map(s=><StayCard key={s.uid} stay={s} prop={prop} job={jobForStay(s)} readOnly={readOnly} currentUser={currentUser}/>)}
        </>}

        {propStays.length===0&&<div style={{fontSize:13,color:COLORS.slate,padding:"14px 0"}}>No bookings synced yet. {!readOnly?"Click Re-sync above.":""}</div>}
      </div>;
    })}
  </div>;
}

function StayCard({stay,prop,job,readOnly,currentUser}) {
  const db = useContext(DbCtx);
  const st = stayStatus(stay);
  const sc = statusColor(st);
  const [expanded,setExpanded] = useState(st==="active"||st==="upcoming");
  const [photos,   setPhotos]  = useState([]);
  const [lightbox, setLightbox]= useState(null);

  useEffect(() => {
    if (!expanded || !job || !db) return;
    const ref = db.ref(`jobPhotos/${job.id}`);
    ref.on("value", s => setPhotos(objArr(s.val())));
    return () => ref.off();
  }, [expanded, job?.id]);

  const uploadPhoto = async (e, type) => {
    const file = e.target.files[0];
    if (!file || !job) return;
    const dataUrl = await compressImage(file);
    const id = String(Date.now());
    await db.ref(`jobPhotos/${job.id}/${id}`).set({id, jobId:job.id, type, dataUrl, uploadedBy:currentUser.name, uploadedAt:new Date().toISOString()});
    e.target.value = "";
  };
  const removePhoto = async id => { await db.ref(`jobPhotos/${job.id}/${id}`).remove(); };

  const assignCleaner = async cleaner => {
    if (!job) return;
    await db.ref(`jobs/${job.id}`).update({cleaner: cleaner||null});
  };
  const updateJobStatus = async newStatus => {
    if (!job) return;
    const now = new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    if (newStatus==="in-progress") await db.ref(`jobs/${job.id}`).update({status:"in-progress",arrivedAt:now});
    if (newStatus==="complete")    await db.ref(`jobs/${job.id}`).update({status:"complete",completedAt:now});
  };

  return <div style={{marginBottom:10,borderRadius:14,border:`1px solid ${COLORS.border}`,overflow:"hidden"}}>
    {/* Stay header */}
    <div onClick={()=>setExpanded(v=>!v)} style={{padding:"14px 18px",background:COLORS.white,cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>

        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>

            {st.charAt(0).toUpperCase()+st.slice(1)}
          </span>
          <span style={{fontSize:12,color:COLORS.slate,fontWeight:600}}>{stay.nights} night{stay.nights!==1?"s":""}</span>
        </div>
        <div style={{fontSize:12,color:COLORS.slate}}>
          Check-in: {fmtDate(stay.start)} at {prop.checkinTime||"3:00 PM"} · Checkout: {fmtDate(stay.end)} at {prop.checkoutTime||"11:00 AM"}
        </div>
      </div>
      <span style={{color:COLORS.slate,fontSize:16,transition:"transform .2s",transform:expanded?"rotate(90deg)":"none"}}>›</span>
    </div>

      {/* Full stay details */}

        <div style={{background:COLORS.white,borderRadius:10,padding:"10px 14px"}}>

function AddPropertyModal({open,onClose,properties,onSync}) {
  const db = useContext(DbCtx);
  const [name,setName]=useState(""); const [url,setUrl]=useState(""); const [raw,setRaw]=useState("");
  const [showPaste,setShowPaste]=useState(false); const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
  const [checkinTime,setCheckinTime]=useState("3:00 PM"); const [checkoutTime,setCheckoutTime]=useState("11:00 AM");

  if (!open) return null;
  const submit = async () => {
    if (!name.trim()){setErr("Enter a property name.");return;}
    if (!url.trim()&&!raw.trim()){setErr("Enter an iCal URL or paste iCal content.");return;}
    setLoading(true); setErr("");
    const prop = {id:String(Date.now()),name:name.trim(),icalUrl:url.trim(),color:PROP_COLORS[properties.length%PROP_COLORS.length],address:"",checkinTime,checkoutTime,lastSynced:null};

// ─── TURNOVER TIMER ───────────────────────────────────────────────────────────
function TurnoverTimer({job, prop, large=false}) {
  const db = useContext(DbCtx);
  const [now, setNow] = useState(()=>Date.now());
  const alertFiredRef = useRef(false);

  const windowStart = parseWindowTime(job?.checkoutDate, prop?.checkoutTime||"11:00 AM");
  const windowEnd   = parseWindowTime(job?.checkinDate,  prop?.checkinTime ||"3:00 PM");

  useEffect(()=>{
    const id = setInterval(()=>setNow(Date.now()),1000);
    return ()=>clearInterval(id);
  },[]);

  // Write overdueAlertSent flag once when window expires and job still not complete
  useEffect(()=>{
    if (!db||!job||!windowEnd||job.status==="complete"||job.overdueAlertSent||alertFiredRef.current) return;
    if (now>windowEnd) { alertFiredRef.current=true; db.ref(`jobs/${job.id}/overdueAlertSent`).set(true); }
  },[now]);

  if (!job?.checkoutDate||!job?.checkinDate||!windowStart||!windowEnd) return null;

  const totalWindow = windowEnd-windowStart;
  const remaining   = windowEnd-now;

  // Completed — show time to spare
  if (job.status==="complete"&&job.completedAt) {
    const spare = windowEnd - new Date(job.completedAt).getTime();
    return <div style={{fontSize:large?14:11,fontWeight:700,color:"#059669",background:"#D1FAE5",padding:"4px 10px",borderRadius:20,display:"inline-flex",alignItems:"center",gap:4}}>
      ✅ Done · {spare>0?`${fmtWindowDuration(spare)}to spare`:"On time"}
    </div>;
  }

  // Not started yet — show when window opens
  if (now<windowStart) {
    const untilStart = windowStart-now;
    return <div style={{fontSize:large?13:11,color:COLORS.slate,lineHeight:1.5}}>
      <div style={{fontWeight:600,color:COLORS.navy}}>
        Checkout {prop.checkoutTime||"11:00 AM"} · {fmtWindowDuration(totalWindow)}window
      </div>
      <div>Starts in {fmtWindowDuration(untilStart)}</div>
    </div>;
  }

  // Overdue
  if (remaining<=0) {
    return <div className={large?"timer-flash":""} style={{fontSize:large?28:14,fontWeight:800,color:"#DC2626",display:"flex",alignItems:"center",gap:6}}>
      {large&&<span style={{fontSize:20}}>🔴</span>}
      <span>OVERDUE{large?" — Guest arriving soon!":""}</span>
    </div>;
  }

  // Live countdown
  const h=Math.floor(remaining/3600000), m=Math.floor((remaining%3600000)/60000), s=Math.floor((remaining%60000)/1000);
  const color = remaining>7200000?COLORS.green:remaining>3600000?COLORS.amber:"#DC2626";
  const isUrgent = remaining<=3600000;
  const pct = Math.max(0,Math.min(100,(remaining/totalWindow)*100));

  return <div style={{display:"inline-block"}}>
    <div className={isUrgent&&large?"timer-flash":""} style={{fontFamily:"monospace",fontSize:large?36:15,fontWeight:800,color,letterSpacing:large?2:1}}>
      {pad2(h)}:{pad2(m)}:{pad2(s)}
    </div>
    {large&&<div style={{marginTop:6,height:4,borderRadius:2,background:"#E2E8F0",overflow:"hidden"}}>
      <div style={{height:"100%",borderRadius:2,background:color,width:`${pct}%`,transition:"width 1s linear"}}/>
    </div>}
    {large&&<div style={{fontSize:11,color:COLORS.slate,marginTop:4}}>
      {isUrgent?"⚠️ Under 1 hour — wrap up soon!":remaining>7200000?"🟢 On track":"🟡 Getting tight"}
    </div>}
  </div>;
}

  const [selProp,setSelProp]=useState(null);
  const [showFlag,setShowFlag]=useState(false);
  const [newItem,setNewItem]=useState(""); const [customItem,setCustomItem]=useState("");

  const activeProp = selProp || properties[0]?.id || null;
  const propInv = inventory.filter(i=>i.propertyId===activeProp);
  const pending  = propInv.filter(i=>i.status==="pending");
  const ordered  = propInv.filter(i=>i.status==="ordered");
  const restocked= propInv.filter(i=>i.status==="restocked");

  const updateStatus = async (item,status) => {
    await db.ref(`inventory/${item.propertyId}/${item.id}`).update({status, ...(status==="ordered"?{orderedAt:new Date().toISOString()}:{}), ...(status==="restocked"?{restockedAt:new Date().toISOString()}:{})});
  };
  const removeItem = async item => {
    await db.ref(`inventory/${item.propertyId}/${item.id}`).remove();

    const item = newItem==="custom"?customItem:newItem;
    if (!activeProp||!item) return;
    const id = String(Date.now());
    await db.ref(`inventory/${activeProp}/${id}`).set({id,propertyId:activeProp,item,status:"pending",flaggedAt:new Date().toISOString(),flaggedBy:currentUser.name});

    const now = new Date().toISOString();
    const update = {status, updatedAt:now};
    if (status==="in-progress") update.arrivedAt = now;
    if (status==="complete")    update.completedAt = now;
    await db.ref(`jobs/${job.id}`).update(update);
  };

  const JobCard = ({job, highlight=false}) => {
    const prop = properties.find(p=>p.id===job.propertyId) || {name:"Unknown",color:"#94A3B8"};
    const isToday   = job.checkoutDate === todayStr;
    const dateLabel = isToday ? "Today" : new Date(...job.checkoutDate.split("-").map((v,i)=>i===1?v-1:Number(v)))
      .toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

    return <div onClick={()=>setSelected({job,prop})}
      style={{background:"#fff",borderRadius:16,overflow:"hidden",
              boxShadow:highlight?"0 4px 20px rgba(27,79,216,0.15)":"0 1px 4px rgba(0,0,0,0.07)",
              border:highlight?`2px solid ${COLORS.blue}`:`1.5px solid ${COLORS.border}`,
              marginBottom:12,cursor:"pointer"}}>

      {/* Color bar */}
      <div style={{height:5,background:prop.color,width:"100%"}}/>

      <div style={{padding:"16px 18px"}}>
        {/* Property + date */}
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:10,gap:8}}>
          <div>
            <div style={{fontWeight:700,fontSize:17,color:COLORS.navy,marginBottom:2}}>{prop.name}</div>
            {prop.address&&<div style={{fontSize:12,color:COLORS.slate}}>{prop.address}</div>}
          </div>
          <div style={{flexShrink:0,textAlign:"right"}}>
            <div style={{fontSize:isToday?13:12,fontWeight:700,
                         color:isToday?"#fff":COLORS.slate,
                         background:isToday?COLORS.blue:"transparent",
                         padding:isToday?"3px 10px":"0",borderRadius:20}}>
              {dateLabel}
            </div>
            <div style={{fontSize:11,color:COLORS.slate,marginTop:3}}>
              Checkout {prop.checkoutTime||"11:00 AM"}
            </div>
          </div>
        </div>

        {/* Timer */}
        {job.checkinDate&&<div style={{marginBottom:12,padding:"10px 14px",background:COLORS.surface,borderRadius:10}}>
          <div style={{fontSize:10,fontWeight:700,color:COLORS.slate,letterSpacing:1,marginBottom:4}}>CLEANING WINDOW</div>
          <TurnoverTimer job={job} prop={prop} large/>
        </div>}

        {/* Status + actions */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:job.status!=="complete"?12:0}}>
          <Badge config={jobStatusCfg[job.status]} small/>
          {job.status==="in-progress"&&job.arrivedAt&&
            <span style={{fontSize:11,color:COLORS.slate}}>Started {new Date(job.arrivedAt).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}</span>}
        </div>

        {job.status==="pending"&&<button
          onClick={e=>{e.stopPropagation();updateStatus(job,"in-progress");}}
          style={{width:"100%",padding:"14px",borderRadius:12,border:"none",cursor:"pointer",
                  background:COLORS.amber,color:"#fff",fontFamily:FONT,fontSize:15,fontWeight:700,
                  display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          🕐 Start Cleaning
        </button>}

        {job.status==="in-progress"&&<button
          onClick={e=>{e.stopPropagation();updateStatus(job,"complete");}}
          style={{width:"100%",padding:"14px",borderRadius:12,border:"none",cursor:"pointer",
                  background:COLORS.green,color:"#fff",fontFamily:FONT,fontSize:15,fontWeight:700,
                  display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          ✅ Mark Complete
        </button>}

        {job.status==="complete"&&<div style={{textAlign:"center",fontSize:13,fontWeight:600,color:"#059669",padding:"6px 0"}}>
          ✅ Completed {job.completedAt?new Date(job.completedAt).toLocaleDateString("en-US",{month:"short",day:"numeric"}):""}
        </div>}
      </div>
    </div>;
  };

  const Section = ({title, count, children, accent}) => (
    <div style={{marginBottom:24}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
        <h3 style={{fontFamily:DISPLAY,fontSize:15,fontWeight:700,color:accent||COLORS.navy}}>{title}</h3>
        {count>0&&<span style={{background:accent||COLORS.blue,color:"#fff",fontSize:11,fontWeight:700,padding:"1px 8px",borderRadius:20}}>{count}</span>}
      </div>
      {children}
    </div>
  );

  return <div style={{paddingBottom:40}}>
    {/* Header */}
    <div style={{background:`linear-gradient(135deg,${COLORS.navy},#1B3A6B)`,borderRadius:16,padding:"20px 22px",marginBottom:24}}>
      <div style={{color:"rgba(255,255,255,0.6)",fontSize:12,marginBottom:3}}>
        {new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
      </div>
      <div style={{color:"#fff",fontSize:20,fontWeight:700,fontFamily:DISPLAY,marginBottom:2}}>
        Hi {currentUser.name.split(" ")[0]} 👋
      </div>
      <div style={{color:"rgba(255,255,255,0.7)",fontSize:13}}>
        {todayJobs.length>0
          ?`${todayJobs.length} job${todayJobs.length>1?"s":""} today — let's go!`
          :upcomingJobs.length>0
          ?`${upcomingJobs.length} upcoming job${upcomingJobs.length>1?"s":""}`
          :"No jobs assigned yet"}
      </div>
    </div>

    {/* Today */}
    {todayJobs.length>0&&<Section title="Today" count={todayJobs.length} accent="#DC2626">
      {todayJobs.map(j=><JobCard key={j.id} job={j} highlight/>)}
    </Section>}

    {/* Upcoming */}
    {upcomingJobs.length>0&&<Section title="Upcoming" count={upcomingJobs.length}>
      {upcomingJobs.map(j=><JobCard key={j.id} job={j}/>)}
    </Section>}

    {/* Empty state */}
    {myJobs.filter(j=>j.status!=="complete").length===0&&<Card style={{textAlign:"center",padding:40}}>
      <div style={{fontSize:40,marginBottom:12}}>🧹</div>
      <div style={{fontWeight:700,fontSize:16,color:COLORS.navy,marginBottom:6}}>No jobs assigned yet</div>
      <div style={{fontSize:13,color:COLORS.slate}}>Jobs will appear here once assigned. Check the Calendar tab to claim available jobs.</div>
    </Card>}

    {/* Completed */}
    {doneJobs.length>0&&<div>
      <button onClick={()=>setShowDone(v=>!v)}
        style={{background:"none",border:`1.5px solid ${COLORS.border}`,borderRadius:10,padding:"10px 16px",
                cursor:"pointer",fontFamily:FONT,fontSize:13,fontWeight:600,color:COLORS.slate,
                width:"100%",marginBottom:12}}>
        {showDone?"▲ Hide":"▼ Show"} completed jobs ({doneJobs.length})
      </button>
      {showDone&&doneJobs.map(j=><JobCard key={j.id} job={j}/>)}
    </div>}

    {/* Detail modal */}
    {selected&&<BookingDetailModal
      detail={{job:selected.job, prop:selected.prop, stay:{start:selected.job.checkinDate||selected.job.checkoutDate, end:selected.job.checkoutDate, nights:1}, isTurnover:false}}
      onClose={()=>setSelected(null)}
      currentUser={currentUser}
      accounts={[]}
      isCleaner/>}
  </div>;
}

// ─── SCHEDULE MANAGER VIEW (Landscape + Garbage manager interface) ────────────
function ScheduleManagerView({jobs, jobType, accounts, properties, currentUser}) {
  const db = useContext(DbCtx);
  const [showNew, setShowNew]   = useState(false);
  const [filter,  setFilter]    = useState("all");
  const [newJob,  setNewJob]    = useState({propertyId:"",scheduledDate:"",worker:"",notes:"",pickupType:""});

  const dbPath    = jobType==="landscape" ? "landscapeJobs" : "garbageJobs";
  const icon      = jobType==="landscape" ? "🌿" : "🗑";
  const roleKey   = jobType==="landscape" ? "landscaper" : "garbage";
  const workers   = accounts.filter(a=>a.authorized&&a.role===roleKey).map(a=>a.name);

  const filtered  = filter==="all" ? jobs : jobs.filter(j=>j.status===filter);
  const sorted    = filtered.slice().sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));

  const addJob = async () => {
    if (!newJob.propertyId||!newJob.scheduledDate) return;
    const id = String(Date.now());
    const now = new Date().toISOString();
    await db.ref(`${dbPath}/${id}`).set({
      id, propertyId:newJob.propertyId, scheduledDate:newJob.scheduledDate,
      worker:newJob.worker||null, status:"pending",
      notes:newJob.notes||"", pickupType:newJob.pickupType||"",
      createdAt:now, updatedAt:now,
    });
    setShowNew(false); setNewJob({propertyId:"",scheduledDate:"",worker:"",notes:"",pickupType:""});
  };

  const removeJob = async id => { if (window.confirm("Remove this job?")) await db.ref(`${dbPath}/${id}`).remove(); };
  const assignWorker = async (id, worker) => { await db.ref(`${dbPath}/${id}`).update({worker:worker||null,updatedAt:new Date().toISOString()}); };

  return <div>
    <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
      {["all","pending","complete"].map(f=>(
        <button key={f} onClick={()=>setFilter(f)} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:FONT,fontSize:12,fontWeight:600,background:filter===f?COLORS.blue:COLORS.sky,color:filter===f?"#fff":COLORS.slate}}>
          {f==="all"?"All":f==="pending"?"Pending":"Completed"}
        </button>
      ))}
      <div style={{flex:1}}/>
      <Btn small onClick={()=>setShowNew(true)}>{icon} New Job</Btn>
    </div>

    {showNew&&<Card style={{marginBottom:20,padding:20}}>
      <div style={{fontWeight:700,fontSize:15,color:COLORS.navy,marginBottom:16}}>{icon} Schedule New Job</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div>
          <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>Property</label>
          <select value={newJob.propertyId} onChange={e=>setNewJob(v=>({...v,propertyId:e.target.value}))}
            style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1.5px solid ${COLORS.border}`,fontSize:13}}>
            <option value="">Select property…</option>
            {properties.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div>
          <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>Scheduled Date</label>
          <input type="date" value={newJob.scheduledDate} onChange={e=>setNewJob(v=>({...v,scheduledDate:e.target.value}))}
            style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1.5px solid ${COLORS.border}`,fontSize:13}}/>
        </div>
        <div>
          <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>Assign to</label>
          <select value={newJob.worker} onChange={e=>setNewJob(v=>({...v,worker:e.target.value}))}
            style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1.5px solid ${COLORS.border}`,fontSize:13}}>
            <option value="">Unassigned</option>
            {workers.map(w=><option key={w} value={w}>{w}</option>)}
          </select>
        </div>
        {jobType==="garbage"&&<div>
          <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>Pickup Type</label>
          <select value={newJob.pickupType} onChange={e=>setNewJob(v=>({...v,pickupType:e.target.value}))}
            style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1.5px solid ${COLORS.border}`,fontSize:13}}>
            <option value="">General</option>
            <option value="Garbage">🗑 Garbage</option>
            <option value="Recycling">♻️ Recycling</option>
            <option value="Compost">🌱 Compost</option>
          </select>
        </div>}
        <div>
          <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>Notes (optional)</label>
          <input value={newJob.notes} onChange={e=>setNewJob(v=>({...v,notes:e.target.value}))} placeholder="Any special instructions…"
            style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1.5px solid ${COLORS.border}`,fontSize:13}}/>
        </div>
        <div style={{display:"flex",gap:8}}>
          <Btn onClick={addJob} disabled={!newJob.propertyId||!newJob.scheduledDate}>Save Job</Btn>
          <Btn variant="ghost" onClick={()=>setShowNew(false)}>Cancel</Btn>
        </div>
      </div>
    </Card>}

    {sorted.length===0?<Card style={{textAlign:"center",padding:36}}>
      <div style={{fontSize:36,marginBottom:10}}>{icon}</div>
      <div style={{fontWeight:700,fontSize:15,color:COLORS.navy,marginBottom:6}}>No jobs yet</div>
      <div style={{fontSize:13,color:COLORS.slate}}>Click "{icon} New Job" to schedule the first one.</div>
    </Card>:<div style={{display:"flex",flexDirection:"column",gap:10}}>
      {sorted.map(job=>{
        const prop = properties.find(p=>p.id===job.propertyId)||{name:"Unknown",color:"#94A3B8"};
        const dateLabel = new Date(...job.scheduledDate.split("-").map((v,i)=>i===1?v-1:Number(v)))
          .toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
        return <Card key={job.id} style={{padding:"14px 18px"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:8,height:40,borderRadius:4,background:prop.color,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                <span style={{fontWeight:700,fontSize:14,color:COLORS.navy}}>{prop.name}</span>
                <Badge config={job.status==="complete"?{label:"Complete",bg:"#D1FAE5",color:"#065F46"}:{label:"Pending",bg:"#FEF3C7",color:"#92400E"}} small/>
                {job.pickupType&&<span style={{fontSize:11,color:COLORS.slate}}>{job.pickupType}</span>}
              </div>
              <div style={{fontSize:12,color:COLORS.slate,marginBottom:6}}>{dateLabel}{job.notes?` · ${job.notes}`:""}</div>
              <select value={job.worker||""} onChange={e=>assignWorker(job.id,e.target.value)}
                style={{fontSize:12,padding:"4px 8px",borderRadius:6,border:`1px solid ${COLORS.border}`,background:"#fff"}}>
                <option value="">Unassigned</option>
                {workers.map(w=><option key={w} value={w}>{w}</option>)}
              </select>
            </div>
            <button onClick={()=>removeJob(job.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:COLORS.slate,padding:4}}>🗑</button>
          </div>
        </Card>;
      })}
    </div>}
  </div>;
}

// ─── OPERATIONS CALENDAR ─────────────────────────────────────────────────────
function BookingDetailModal({detail,onClose,currentUser,accounts,isCleaner}) {
  const db = useContext(DbCtx);
  const [photos,setPhotos]   = useState([]);
  const [liveJob,setLiveJob] = useState(detail.job||null);
  const [lightbox,setLightbox] = useState(null);
  const cleaners = (accounts||[]).filter(a=>a.role==="cleaner").map(a=>a.name);

  useEffect(()=>{
    if (!detail.job?.id||!db) return;
    const jobRef   = db.ref(`jobs/${detail.job.id}`);
    const photoRef = db.ref(`jobPhotos/${detail.job.id}`);
    jobRef.on("value",   s=>{ if(s.val()) setLiveJob(s.val()); });
    photoRef.on("value", s=>setPhotos(objArr(s.val())));
    return ()=>{ jobRef.off(); photoRef.off(); };
  },[detail.job?.id]);

  const assignCleaner = async val => {
    if (!liveJob||!db) return;
    await db.ref(`jobs/${liveJob.id}`).update({cleaner:val||null,updatedAt:new Date().toISOString()});
  };
  const updateJobStatus = async status => {
    if (!liveJob||!db) return;
    await db.ref(`jobs/${liveJob.id}`).update({status,updatedAt:new Date().toISOString()});
  };
  const uploadPhoto = async (e, type) => {
    const file = e.target.files[0];
    if (!file||!liveJob) return;
    const dataUrl = await compressImage(file);
    const id = String(Date.now());
    await db.ref(`jobPhotos/${liveJob.id}/${id}`).set({
      id, jobId:liveJob.id, type, dataUrl,
      uploadedBy:currentUser.name, uploadedAt:new Date().toISOString()
    });
    e.target.value="";
  };
  const removePhoto = async id => {
    if (!liveJob) return;
    await db.ref(`jobPhotos/${liveJob.id}/${id}`).remove();
  };

  const beforePhotos = photos.filter(p=>p.type==="before");
  const afterPhotos  = photos.filter(p=>p.type==="after");

  return <Modal onClose={onClose}>
    {/* Header */}
    <div style={{marginBottom:20}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <div style={{width:14,height:14,borderRadius:"50%",background:detail.prop.color,flexShrink:0}}/>
        <h3 style={{fontFamily:DISPLAY,fontSize:20,color:COLORS.navy,margin:0,flex:1}}>{detail.prop.name}</h3>
        {detail.isTurnover&&<span style={{background:"#FFF7ED",color:"#C2410C",fontWeight:700,fontSize:11,padding:"3px 10px",borderRadius:20,border:"1px solid #FED7AA",whiteSpace:"nowrap"}}>⚡ Same-day turnover</span>}
      </div>
      {detail.prop.address&&<div style={{fontSize:13,color:COLORS.slate,marginLeft:24}}>{detail.prop.address}</div>}
    </div>

    {/* Turnover timer — shown when there's an active cleaning window */}
    {liveJob?.checkinDate&&<div style={{background:COLORS.surface,borderRadius:12,padding:"14px 16px",marginBottom:14,textAlign:"center"}}>
      <div style={{fontSize:11,fontWeight:700,color:COLORS.slate,letterSpacing:1,marginBottom:6}}>CLEANING WINDOW</div>

    {/* Check-in / checkout */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
      <div style={{background:"#DBEAFE",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontSize:11,color:"#1D4ED8",fontWeight:700,marginBottom:3}}>CHECK-IN</div>
        <div style={{fontSize:14,fontWeight:700,color:COLORS.navy}}>{fmtDateLong(detail.stay.start)}</div>
        <div style={{fontSize:13,color:COLORS.blue,marginTop:2}}>at {detail.prop.checkinTime||"3:00 PM"}</div>
      </div>
      <div style={{background:"#FEF3C7",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontSize:11,color:"#92400E",fontWeight:700,marginBottom:3}}>CHECKOUT</div>
        <div style={{fontSize:14,fontWeight:700,color:COLORS.navy}}>{fmtDateLong(detail.stay.end)}</div>
        <div style={{fontSize:13,color:"#92400E",marginTop:2}}>at {detail.prop.checkoutTime||"11:00 AM"}</div>
      </div>
    </div>

    {/* Duration + status */}
    <div style={{background:COLORS.surface,borderRadius:10,padding:"12px 16px",marginBottom:12,display:"flex",gap:24,flexWrap:"wrap"}}>
      <div>
        <div style={{fontSize:11,color:COLORS.slate,marginBottom:2}}>Duration</div>
        <div style={{fontSize:17,fontWeight:700,color:COLORS.navy}}>{detail.stay.nights} night{detail.stay.nights!==1?"s":""}</div>
      </div>
