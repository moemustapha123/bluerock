        <div style={{fontSize:11,color:COLORS.slate,marginBottom:2}}>Assigned Cleaner</div>
        <div style={{fontSize:14,fontWeight:700,color:COLORS.navy}}>👤 {liveJob.cleaner}</div>
      </div>}
      {liveJob?.status&&<div>
        <div style={{fontSize:11,color:COLORS.slate,marginBottom:4}}>Clean Status</div>
        <Badge config={jobStatusCfg[liveJob.status]} small/>
      </div>}
    </div>

    {/* Turnover warning */}
    {detail.isTurnover&&<div style={{background:"#FFF7ED",borderRadius:10,padding:"12px 14px",border:"1px solid #FED7AA",marginBottom:12}}>
      <div style={{fontWeight:700,fontSize:13,color:"#C2410C",marginBottom:4}}>⚡ Urgent — Same-day Turnover</div>
      <div style={{fontSize:12,color:"#92400E",lineHeight:1.65}}>
        Clean window: <strong>{detail.prop.checkoutTime||"11:00 AM"}</strong> → <strong>{detail.prop.checkinTime||"3:00 PM"}</strong>
      </div>
    </div>}

    {/* Job management — only when there's a job */}
    {liveJob&&<div style={{borderTop:`1px solid ${COLORS.border}`,paddingTop:14,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:13,color:COLORS.navy,marginBottom:10}}>Cleaning Job</div>

      {/* Cleaner: self-assign (cleaner role) */}
      {isCleaner&&<div style={{marginBottom:10}}>
        {!liveJob.cleaner&&<Btn variant="outline" small onClick={()=>assignCleaner(currentUser.name)}
          style={{width:"100%",justifyContent:"center",marginBottom:6}}>✋ Claim This Job</Btn>}
        {liveJob.cleaner&&liveJob.cleaner!==currentUser.name&&
          <div style={{fontSize:12,color:COLORS.slate,marginBottom:6,fontStyle:"italic"}}>Assigned to {liveJob.cleaner}</div>}
        {liveJob.cleaner===currentUser.name&&<>
          {liveJob.status==="pending"&&<>
            <Btn variant="amber" small onClick={()=>updateJobStatus("in-progress")}
              style={{width:"100%",justifyContent:"center",marginBottom:6}}>🕐 Start Cleaning</Btn>
            <Btn variant="ghost" small onClick={()=>assignCleaner(null)}
              style={{width:"100%",justifyContent:"center"}}>Unclaim</Btn>
          </>}
          {liveJob.status==="in-progress"&&<Btn variant="green" small onClick={()=>updateJobStatus("complete")}
            style={{width:"100%",justifyContent:"center",marginBottom:6}}>✓ Mark Complete</Btn>}
        </>}
      </div>}

      {/* Cleaner: manager/owner assignment dropdown */}
      {!isCleaner&&<div style={{marginBottom:10}}>
        <select value={liveJob.cleaner||""} onChange={e=>assignCleaner(e.target.value||null)}
          style={{width:"100%",padding:"8px 10px",borderRadius:8,border:`1.5px solid ${COLORS.border}`,fontSize:13,marginBottom:6,background:"#fff"}}>
          <option value="">Unassigned</option>
          {cleaners.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        {liveJob.status==="pending"&&<Btn variant="amber" small onClick={()=>updateJobStatus("in-progress")}
          style={{width:"100%",justifyContent:"center",marginBottom:6}}>🕐 Mark In Progress</Btn>}
        {liveJob.status==="in-progress"&&<Btn variant="green" small onClick={()=>updateJobStatus("complete")}
          style={{width:"100%",justifyContent:"center"}}>✓ Mark Complete</Btn>}
      </div>}

      {/* Photo upload */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"8px 0",borderRadius:8,border:`1.5px dashed ${COLORS.border}`,cursor:"pointer",fontSize:12,color:COLORS.slate,fontWeight:600}}>
          📷 Before
          <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>uploadPhoto(e,"before")}/>
        </label>
        <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"8px 0",borderRadius:8,border:`1.5px dashed ${COLORS.border}`,cursor:"pointer",fontSize:12,color:COLORS.slate,fontWeight:600}}>
          ✅ After
          <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>uploadPhoto(e,"after")}/>
        </label>
      </div>

      {/* Photo grid */}
      {photos.length>0&&<div>
        {beforePhotos.length>0&&<div style={{marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,color:COLORS.slate,marginBottom:6}}>BEFORE ({beforePhotos.length})</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {beforePhotos.map(p=><div key={p.id} style={{position:"relative"}}>
              <img src={p.dataUrl} alt="before" onClick={()=>setLightbox(p.dataUrl)}
                style={{width:70,height:70,objectFit:"cover",borderRadius:8,cursor:"pointer",border:`2px solid ${COLORS.border}`}}/>
              <button onClick={()=>removePhoto(p.id)}
                style={{position:"absolute",top:-6,right:-6,background:"#EF4444",color:"#fff",border:"none",borderRadius:"50%",width:18,height:18,fontSize:11,cursor:"pointer",lineHeight:"18px",padding:0}}>×</button>
            </div>)}
          </div>
        </div>}
        {afterPhotos.length>0&&<div>
          <div style={{fontSize:11,fontWeight:700,color:COLORS.slate,marginBottom:6}}>AFTER ({afterPhotos.length})</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {afterPhotos.map(p=><div key={p.id} style={{position:"relative"}}>
              <img src={p.dataUrl} alt="after" onClick={()=>setLightbox(p.dataUrl)}
                style={{width:70,height:70,objectFit:"cover",borderRadius:8,cursor:"pointer",border:`2px solid ${COLORS.green}`}}/>
              <button onClick={()=>removePhoto(p.id)}
                style={{position:"absolute",top:-6,right:-6,background:"#EF4444",color:"#fff",border:"none",borderRadius:"50%",width:18,height:18,fontSize:11,cursor:"pointer",lineHeight:"18px",padding:0}}>×</button>
            </div>)}
          </div>
        </div>}
      </div>}
    </div>}

    {/* Lightbox */}
    {lightbox&&<div onClick={()=>setLightbox(null)}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <img src={lightbox} style={{maxWidth:"90vw",maxHeight:"90vh",borderRadius:12,boxShadow:"0 8px 40px #0008"}}/>
    </div>}
  </Modal>;
}

function OpsCalendarView({stays,properties,jobs,currentUser,accounts}) {
  const calRef  = useRef(null);
  const fcRef   = useRef(null);
  const [detail,    setDetail]     = useState(null);
  const [hidden,    setHidden]     = useState(new Set());
  const [showFilter,setShowFilter] = useState(false);

  // Return set of "propId_date" that are same-day turnovers
  const getTurnovers = arr => {
    const checkouts = new Set(arr.map(s=>`${s.propId}_${s.end}`));
    const res = new Set();
    arr.forEach(s=>{ if(checkouts.has(`${s.propId}_${s.start}`)) res.add(`${s.propId}_${s.start}`); });
    return res;
  };

  const buildEvents = (staysArr,propsArr,jobsArr,hiddenSet) => {
    const turnovers = getTurnovers(staysArr);
    return staysArr.filter(s=>!hiddenSet.has(s.propId)).map(s=>{
      const prop = propsArr.find(p=>p.id===s.propId);
      if (!prop) return null;
      const job = jobsArr.find(j=>j.propertyId===s.propId&&j.checkoutDate===s.end);
      const isTurnover = turnovers.has(`${s.propId}_${s.start}`);
      return {
        id: s.uid, start: s.start, end: s.end, allDay: true, title: prop.name,
        backgroundColor: prop.color, borderColor: prop.color,
        classNames: isTurnover?['fc-ev-turnover']:[],
        extendedProps: {stay:s,prop,job,isTurnover},
      };
    }).filter(Boolean);
  };

  // Init FullCalendar once
  useEffect(()=>{
    if (!calRef.current||typeof FullCalendar==='undefined') return;
    const cal = new FullCalendar.Calendar(calRef.current,{
      initialView:'dayGridMonth',
      headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,dayGridWeek,listWeek'},
      buttonText:{today:'Today',month:'Month',week:'Week',list:'Agenda'},
      fixedWeekCount:false, dayMaxEvents:4, height:'auto',
      eventContent: arg=>{
        const {isTurnover}=arg.event.extendedProps;
        const wrap=document.createElement('div');
        wrap.style.cssText='display:flex;align-items:center;gap:3px;padding:1px 5px;overflow:hidden;width:100%;min-width:0';
        if(isTurnover){const b=document.createElement('span');b.textContent='⚡';b.style.cssText='font-size:9px;flex-shrink:0;line-height:1';wrap.appendChild(b);}
        const t=document.createElement('span');
        t.textContent=arg.event.title;
        t.style.cssText='font-size:11px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;line-height:1.5';
        wrap.appendChild(t);
        return {domNodes:[wrap]};
      },
      eventClick: info=>setDetail(info.event.extendedProps),
      eventDidMount: arg=>{
        if(arg.event.extendedProps.isTurnover){arg.el.style.borderLeft='3px solid #F97316';}
        // Tooltip with checkin/checkout times
        const {prop,stay}=arg.event.extendedProps;
        arg.el.title=`${prop.name}\nCheck-in: ${stay.start} at ${prop.checkinTime||'3:00 PM'}\nCheckout: ${stay.end} at ${prop.checkoutTime||'11:00 AM'}\n${stay.nights} nights`;
      },
    });
    cal.render(); fcRef.current=cal;
    return ()=>{cal.destroy();fcRef.current=null;};
  },[]);

  // Refresh events when data/filters change
  useEffect(()=>{
    if (!fcRef.current) return;
    fcRef.current.removeAllEventSources();
    fcRef.current.addEventSource(buildEvents(stays,properties,jobs,hidden));
  },[stays,properties,jobs,hidden]);

  const toggle   = id=>setHidden(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const showAll  = ()=>setHidden(new Set());
  const hideAll  = ()=>setHidden(new Set(properties.map(p=>p.id)));
  const vis      = properties.length-hidden.size;

  return <div>
    {/* Filter bar */}
    <div style={{marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:showFilter?12:0,flexWrap:"wrap"}}>
        <Btn small variant={showFilter?"primary":"outline"} onClick={()=>setShowFilter(v=>!v)}>
          🏠 {vis<properties.length?`${vis}/${properties.length} Properties`:`${properties.length} Properties`} {showFilter?"▲":"▼"}
        </Btn>
        {!showFilter&&properties.length>0&&<div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",flex:1}}>
          {properties.slice(0,10).map(p=>(
            <div key={p.id} onClick={()=>toggle(p.id)} title={p.name}
              style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",opacity:hidden.has(p.id)?.4:1,padding:"3px 9px",borderRadius:20,border:`1.5px solid ${hidden.has(p.id)?COLORS.border:p.color}`,background:hidden.has(p.id)?"transparent":p.color+"1A",transition:"all .15s"}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:p.color}}/>
              <span style={{fontSize:11,fontWeight:600,color:hidden.has(p.id)?COLORS.slate:COLORS.navy,whiteSpace:"nowrap",maxWidth:90,overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span>
            </div>
          ))}
          {properties.length>10&&<span style={{fontSize:11,color:COLORS.slate}}>+{properties.length-10} more</span>}
          <div style={{display:"flex",alignItems:"center",gap:5,marginLeft:"auto",flexShrink:0}}>
            <div style={{width:20,height:12,borderRadius:3,background:"#1B4FD8",borderLeft:"3px solid #F97316",flexShrink:0}}/>
            <span style={{fontSize:11,color:COLORS.slate,whiteSpace:"nowrap"}}>⚡ Same-day turnover</span>
          </div>
        </div>}
      </div>

      {showFilter&&<Card style={{padding:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <span style={{fontWeight:700,fontSize:14,color:COLORS.navy,flex:1}}>Filter Properties</span>
          <Btn small variant="ghost" onClick={showAll}>Show All</Btn>
          <Btn small variant="ghost" onClick={hideAll}>Hide All</Btn>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
          {properties.map(p=>{
            const h=hidden.has(p.id);
            return <div key={p.id} onClick={()=>toggle(p.id)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",borderRadius:10,cursor:"pointer",background:h?"#F8FAFF":p.color+"1A",border:`1.5px solid ${h?COLORS.border:p.color}`,transition:"all .15s"}}>
              <div style={{width:12,height:12,borderRadius:"50%",background:h?"#CBD5E1":p.color,flexShrink:0}}/>
              <span style={{fontSize:12,fontWeight:600,color:h?COLORS.slate:COLORS.navy,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
              <span style={{fontSize:11,fontWeight:600,color:h?COLORS.slate:COLORS.green,flexShrink:0}}>{h?"Hidden":"✓"}</span>
            </div>;
          })}
        </div>
        <div style={{marginTop:14,paddingTop:12,borderTop:`1px solid ${COLORS.border}`,display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
          <span style={{fontSize:12,fontWeight:700,color:COLORS.slate}}>Legend</span>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:22,height:13,borderRadius:3,background:"#1B4FD8",borderLeft:"3px solid #F97316"}}/>
            <span style={{fontSize:11,color:COLORS.slate}}>⚡ Same-day turnover — urgent clean window</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:22,height:13,borderRadius:3,background:"#1B4FD8"}}/>
            <span style={{fontSize:11,color:COLORS.slate}}>Regular booking</span>
          </div>
        </div>
      </Card>}
    </div>

    {/* FullCalendar */}
    {typeof FullCalendar==='undefined'
      ?<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:13,color:COLORS.slate}}>⏳ Loading calendar…</div></Card>
      :<Card style={{padding:12,overflow:"hidden"}}><div ref={calRef}/></Card>}

    {properties.length===0&&<Card style={{textAlign:"center",padding:36,marginTop:16}}>
      <div style={{fontSize:36,marginBottom:10}}>📅</div>
      <div style={{fontWeight:700,fontSize:15,color:COLORS.navy,marginBottom:6}}>No bookings yet</div>
      <div style={{fontSize:13,color:COLORS.slate}}>Owners can add properties and sync Airbnb iCal from the <strong>Sync</strong> tab.</div>
    </Card>}

    {/* Booking detail modal */}
    {detail&&<BookingDetailModal detail={detail} onClose={()=>setDetail(null)} currentUser={currentUser} accounts={accounts} isCleaner={currentUser?.role==="cleaner"}/>}
  </div>;
}

// ─── MAINTENANCE ─────────────────────────────────────────────────────────────
function SubmitMaintenanceModal({onClose,properties,currentUser,maintenance}) {
  const db = useContext(DbCtx);
  const [propId,setPropId]   = useState(properties[0]?.id||"");
  const [cat,setCat]         = useState("");
  const [title,setTitle]     = useState("");
  const [desc,setDesc]       = useState("");
  const [urgency,setUrgency] = useState("medium");
  const [photos,setPhotos]   = useState([]);
  const [uploading,setUploading] = useState(false);
  const [err,setErr]         = useState("");
  const [saving,setSaving]   = useState(false);

  const existingOpen = (maintenance||[]).filter(t=>t.propertyId===propId&&t.status!=="resolved");

  const addConfirmation = async ticketId => {
    const now = new Date().toISOString();
    await db.ref(`maintenance/${ticketId}/confirmations/${currentUser.id}`).set({name:currentUser.name,at:now});
    await db.ref(`maintenance/${ticketId}`).update({updatedAt:now});
  };
  const removeConfirmation = async ticketId => {
    await db.ref(`maintenance/${ticketId}/confirmations/${currentUser.id}`).remove();
    await db.ref(`maintenance/${ticketId}`).update({updatedAt:new Date().toISOString()});
  };

  const addPhoto = async e => {
    const files = Array.from(e.target.files||[]);
    if (photos.length+files.length>5){setErr("Maximum 5 photos.");return;}
    setUploading(true);
    const compressed = await Promise.all(files.map(f=>compressImage(f)));
    setPhotos(p=>[...p,...compressed.map((dataUrl,i)=>({id:String(Date.now())+i,dataUrl}))]);
    setUploading(false); e.target.value="";
  };

  const submit = async () => {
    if (!propId){setErr("Select a property.");return;}
    if (!cat){setErr("Select a category.");return;}
    if (!title.trim()){setErr("Enter a title.");return;}
    if (!desc.trim()){setErr("Describe the issue.");return;}
    setSaving(true); setErr("");
    const id = String(Date.now());
    const photoObj = {}; photos.forEach(p=>{photoObj[p.id]=p;});
    const now = new Date().toISOString();
    await db.ref(`maintenance/${id}`).set({
      id,propertyId:propId,category:cat,title:title.trim(),description:desc.trim(),
      urgency,status:"open",submittedBy:currentUser.name,submittedById:currentUser.id,
      submittedAt:now,updatedAt:now,photos:photoObj,note:"",noteBy:"",noteAt:""
    });
    onClose();
  };

  return <Modal onClose={onClose} wide>
    <h3 style={{fontFamily:DISPLAY,fontSize:20,color:COLORS.navy,marginBottom:20}}>Submit Maintenance Request</h3>
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div>
        <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>Property</label>
        <select value={propId} onChange={e=>setPropId(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:13}}>
          {properties.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>

      {/* Existing open tickets for this property */}
      {existingOpen.length>0&&<div style={{background:"#FFFBEB",borderRadius:10,padding:"12px 14px",border:"1px solid #FDE68A"}}>
        <div style={{fontWeight:700,fontSize:13,color:"#92400E",marginBottom:10}}>
          ⚠️ {existingOpen.length} open request{existingOpen.length>1?"s":""} already logged for this property — check before submitting a new one
        </div>
        {existingOpen.map(t=>{
          const confirmed = t.confirmations&&t.confirmations[currentUser.id];
          const confCount = Object.keys(t.confirmations||{}).length;
          return <div key={t.id} style={{background:"#fff",borderRadius:8,padding:"10px 12px",marginBottom:7,border:`1px solid ${COLORS.border}`}}>
            <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:4}}>
              <Badge config={urgencyCfg[t.urgency]} small/>
              <span style={{fontWeight:600,fontSize:13,color:COLORS.navy,flex:1}}>{t.title}</span>
              <Badge config={maintStatusCfg[t.status]} small/>
            </div>
            <div style={{fontSize:11,color:COLORS.slate,marginBottom:6}}>{t.category} · by {t.submittedBy}{confCount>0?` · 👁 ${confCount} confirmation${confCount>1?"s":""}`:""}</div>
            {confirmed
              ?<div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:12,color:COLORS.green,fontWeight:600}}>✓ You've confirmed this issue</span>
                <span onClick={()=>removeConfirmation(t.id)} style={{fontSize:11,color:COLORS.slate,cursor:"pointer",textDecoration:"underline"}}>Undo</span>
              </div>
              :<Btn small variant="outline" onClick={()=>addConfirmation(t.id)}>👁 I've seen this too</Btn>}
          </div>;
        })}
        <div style={{fontSize:11,color:"#92400E",marginTop:6}}>If your issue is already listed above, use "I've seen this too" instead of creating a duplicate.</div>
      </div>}

      <div>
        <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>Issue Category</label>
        <select value={cat} onChange={e=>setCat(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:13}}>
          <option value="">Select category…</option>
          {MAINT_CATS.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <FieldInput label='Issue Title' value={title} onChange={e=>setTitle(e.target.value)} placeholder='e.g. "Leaky faucet under kitchen sink"'/>
      <div>
        <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>Description</label>
        <textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Describe the issue in detail…"
          style={{width:"100%",height:90,padding:"9px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:13,resize:"vertical",boxSizing:"border-box"}}/>
      </div>
      <div>
        <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:8}}>Urgency</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          {[["low","🟢 Low","Fix when possible"],["medium","🟡 Medium","Address soon"],["urgent","🔴 Urgent","Needs immediate attention"]].map(([v,l,d])=>(
            <div key={v} onClick={()=>setUrgency(v)} style={{padding:"10px 12px",borderRadius:10,cursor:"pointer",border:`2px solid ${urgency===v?COLORS.blue:COLORS.border}`,background:urgency===v?COLORS.sky:"#fff",transition:"all .15s"}}>
              <div style={{fontSize:13,fontWeight:700,color:urgency===v?COLORS.blue:COLORS.navy,marginBottom:2}}>{l}</div>
              <div style={{fontSize:11,color:COLORS.slate}}>{d}</div>
            </div>
          ))}
        </div>
      </div>
      <div>
        <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:8}}>Photos (optional, up to 5)</label>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          {photos.map(p=>(
            <div key={p.id} style={{position:"relative"}}>
              <img src={p.dataUrl} style={{width:72,height:72,objectFit:"cover",borderRadius:8,border:`1px solid ${COLORS.border}`}}/>
              <button onClick={()=>setPhotos(ph=>ph.filter(x=>x.id!==p.id))} style={{position:"absolute",top:-6,right:-6,width:18,height:18,borderRadius:"50%",background:COLORS.red,color:"#fff",border:"2px solid #fff",cursor:"pointer",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>×</button>
            </div>
          ))}
          {photos.length<5&&<label style={{width:72,height:72,borderRadius:8,border:`2px dashed ${COLORS.border}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:11,color:COLORS.slate,gap:3}}>
            {uploading?"…":"📷"}<span style={{textAlign:"center"}}>{uploading?"Adding…":"Add Photo"}</span>
            <input type="file" accept="image/*" multiple onChange={addPhoto} style={{display:"none"}}/>
          </label>}
        </div>
      </div>
    </div>
    <ErrBox msg={err}/>
    <div style={{display:"flex",gap:10,marginTop:20}}>
      <Btn onClick={submit} disabled={saving}>{saving?"Submitting…":"Submit Request"}</Btn>
      <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
    </div>
  </Modal>;
}

function MaintenanceView({maintenance,properties,currentUser}) {
  const db = useContext(DbCtx);
  const isCleaner = currentUser.role==="cleaner";
  const isOwner   = !isCleaner;
  const [showSubmit,setShowSubmit]       = useState(false);
  const [viewId,setViewId]               = useState(null);
  const [filterStatus,setFilterStatus]   = useState("all");
  const [filterProp,setFilterProp]       = useState("all");
  const [filterUrgency,setFilterUrgency] = useState("all");
  const [editNoteId,setEditNoteId]       = useState(null);
  const [noteText,setNoteText]           = useState("");
  const [commentText,setCommentText]     = useState("");
  const [lightbox,setLightbox]           = useState(null);

  // Everyone sees all tickets — no role filter
  let tickets = [...maintenance];
  if (filterStatus!=="all")  tickets = tickets.filter(t=>t.status===filterStatus);
  if (filterProp!=="all")    tickets = tickets.filter(t=>t.propertyId===filterProp);
  if (filterUrgency!=="all") tickets = tickets.filter(t=>t.urgency===filterUrgency);
  // Sort: urgent unresolved first, then by most recently updated/submitted
  tickets.sort((a,b)=>{
    const uo={urgent:0,medium:1,low:2};
    const aRes=a.status==="resolved", bRes=b.status==="resolved";
    if (aRes!==bRes) return aRes?1:-1;
    if (!aRes&&!bRes&&uo[a.urgency]!==uo[b.urgency]) return uo[a.urgency]-uo[b.urgency];
    return (b.updatedAt||b.submittedAt).localeCompare(a.updatedAt||a.submittedAt);
  });

  const openCount   = maintenance.filter(t=>t.status!=="resolved").length;
  const urgentCount = maintenance.filter(t=>t.urgency==="urgent"&&t.status!=="resolved").length;

  const updateStatus = async (id,st) => {
    const now = new Date().toISOString();
    await db.ref(`maintenance/${id}`).update({status:st,updatedAt:now,...(st==="resolved"?{resolvedAt:now}:{})});
  };
  const saveNote = async id => {
    const now = new Date().toISOString();
    await db.ref(`maintenance/${id}`).update({note:noteText.trim(),noteBy:currentUser.name,noteAt:now,updatedAt:now});
    setEditNoteId(null); setNoteText("");
  };
  const addComment = async id => {
    if (!commentText.trim()) return;
    const cid = String(Date.now()); const now = new Date().toISOString();
    await db.ref(`maintenance/${id}/comments/${cid}`).set({id:cid,text:commentText.trim(),by:currentUser.name,byId:currentUser.id,at:now});
    await db.ref(`maintenance/${id}`).update({updatedAt:now});
    setCommentText("");
  };
  const addConfirmation = async id => {
    const now = new Date().toISOString();
    await db.ref(`maintenance/${id}/confirmations/${currentUser.id}`).set({name:currentUser.name,at:now});
    await db.ref(`maintenance/${id}`).update({updatedAt:now});
  };
  const removeConfirmation = async id => {
    await db.ref(`maintenance/${id}/confirmations/${currentUser.id}`).remove();
    await db.ref(`maintenance/${id}`).update({updatedAt:new Date().toISOString()});
  };
  const deleteTicket = async id => {
    if (!confirm("Delete this ticket permanently?")) return;
    await db.ref(`maintenance/${id}`).remove();
    if (viewId===id) setViewId(null);
  };

  const ticket  = viewId ? (maintenance.find(m=>m.id===viewId)||null) : null;
  const nextSt  = ticket ? NEXT_MAINT[ticket.status] : null;
  const myConf  = ticket && ticket.confirmations && ticket.confirmations[currentUser.id];
  const confArr = ticket ? objArr(ticket.confirmations||{}) : [];
  const comments= ticket ? objArr(ticket.comments||{}).sort((a,b)=>a.at.localeCompare(b.at)) : [];

  return <div>
    {/* Stats banner — all roles if there are open tickets */}
    {openCount>0&&<div style={{display:"grid",gridTemplateColumns:urgentCount>0?"1fr 1fr":"1fr",gap:12,marginBottom:20}}>
      <div style={{background:"#FEE2E2",borderRadius:14,padding:"14px 20px",display:"flex",gap:14,alignItems:"center"}}>
        <span style={{fontSize:28}}>🔧</span>
        <div><div style={{fontSize:26,fontWeight:700,color:COLORS.red,fontFamily:DISPLAY}}>{openCount}</div><div style={{fontSize:12,color:COLORS.slate}}>Open Tickets</div></div>
      </div>
      {urgentCount>0&&<div style={{background:"#FEF2F2",borderRadius:14,padding:"14px 20px",display:"flex",gap:14,alignItems:"center",border:"1px solid #FCA5A5"}}>
        <span style={{fontSize:28}}>🚨</span>
        <div><div style={{fontSize:26,fontWeight:700,color:"#991B1B",fontFamily:DISPLAY}}>{urgentCount}</div><div style={{fontSize:12,color:COLORS.slate}}>Urgent</div></div>
      </div>}
    </div>}

    {/* Toolbar — filters available to everyone */}
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:18,flexWrap:"wrap"}}>
      <Btn small onClick={()=>setShowSubmit(true)}>🔧 Submit Request</Btn>
      <div style={{flex:1}}/>
      <select value={filterProp} onChange={e=>setFilterProp(e.target.value)} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:12,color:COLORS.navy}}>
        <option value="all">All Properties</option>
        {properties.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
      </select>
      <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:12,color:COLORS.navy}}>
        <option value="all">All Statuses</option>
        {Object.entries(maintStatusCfg).map(([v,c])=><option key={v} value={v}>{c.label}</option>)}
      </select>
      <select value={filterUrgency} onChange={e=>setFilterUrgency(e.target.value)} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:12,color:COLORS.navy}}>
        <option value="all">All Urgency</option>
        {Object.entries(urgencyCfg).map(([v,c])=><option key={v} value={v}>{c.label}</option>)}
      </select>
    </div>

    {/* Ticket list */}
    {tickets.length===0
      ?<Card style={{textAlign:"center",padding:40}}>
        <div style={{fontSize:36,marginBottom:12}}>🔧</div>
        <div style={{fontWeight:700,fontSize:16,color:COLORS.navy,marginBottom:6}}>No maintenance tickets</div>
        <div style={{fontSize:13,color:COLORS.slate}}>No tickets match your filters. Tap "Submit Request" to log a new issue.</div>
      </Card>
      :tickets.map(t=>{
        const prop=getProp(t.propertyId,properties);
        const pCount=Object.keys(t.photos||{}).length;
        const cCount=Object.keys(t.comments||{}).length;
        const confCount=Object.keys(t.confirmations||{}).length;
        const mine=t.submittedById===currentUser.id;
        return <Card key={t.id} onClick={()=>setViewId(t.id)} style={{padding:"14px 18px",marginBottom:10}}>
          <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <div style={{width:4,alignSelf:"stretch",borderRadius:4,background:t.urgency==="urgent"?COLORS.red:prop.color,flexShrink:0}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
                <span style={{fontWeight:700,fontSize:14,color:COLORS.navy}}>{t.title}</span>
                <Badge config={urgencyCfg[t.urgency]} small/>
                <Badge config={maintStatusCfg[t.status]} small/>
                {mine&&<span style={{fontSize:10,fontWeight:700,color:COLORS.blue,background:COLORS.sky,padding:"1px 6px",borderRadius:20}}>Mine</span>}
              </div>
              <div style={{fontSize:12,color:COLORS.slate,marginBottom:2}}>{prop.name} · {t.category} · by {t.submittedBy}</div>
              <div style={{fontSize:11,color:COLORS.slate,display:"flex",gap:10,flexWrap:"wrap"}}>
                <span>{new Date(t.updatedAt||t.submittedAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</span>
                {cCount>0&&<span>💬 {cCount}</span>}
                {confCount>0&&<span>👁 {confCount}</span>}
                {pCount>0&&<span>📷 {pCount}</span>}
                {t.note&&<span style={{color:COLORS.blue}}>📝</span>}
              </div>
            </div>
            <span style={{color:COLORS.slate,fontSize:18,flexShrink:0}}>›</span>
          </div>
        </Card>;
      })}

    {showSubmit&&<SubmitMaintenanceModal onClose={()=>setShowSubmit(false)} properties={properties} currentUser={currentUser} maintenance={maintenance}/>}

    {/* Detail modal */}
    {ticket&&<Modal onClose={()=>setViewId(null)} wide>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        <div style={{width:12,height:12,borderRadius:"50%",background:getProp(ticket.propertyId,properties).color,flexShrink:0}}/>
        <h3 style={{fontFamily:DISPLAY,fontSize:18,color:COLORS.navy,margin:0,flex:1}}>{ticket.title}</h3>
        <Badge config={urgencyCfg[ticket.urgency]}/>
        <Badge config={maintStatusCfg[ticket.status]}/>
        {isOwner&&<Btn small variant="red" onClick={()=>deleteTicket(ticket.id)}>Delete</Btn>}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        {[["Property",getProp(ticket.propertyId,properties).name],["Category",ticket.category],["Submitted by",ticket.submittedBy],["Submitted",new Date(ticket.submittedAt).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})],...(ticket.resolvedAt?[["Resolved",new Date(ticket.resolvedAt).toLocaleDateString()]]:[])]
          .map(([l,v])=><div key={l} style={{background:COLORS.surface,borderRadius:10,padding:"10px 14px"}}>
            <div style={{fontSize:11,color:COLORS.slate,marginBottom:2}}>{l}</div>
            <div style={{fontSize:13,fontWeight:600,color:COLORS.navy}}>{v}</div>
          </div>)}
      </div>

      <div style={{background:COLORS.surface,borderRadius:10,padding:"12px 14px",marginBottom:14}}>
        <div style={{fontSize:11,color:COLORS.slate,marginBottom:6}}>Description</div>
        <div style={{fontSize:13,color:COLORS.navy,lineHeight:1.65}}>{ticket.description}</div>
      </div>

      {/* Confirmations */}
      <div style={{background:"#FFFBEB",borderRadius:10,padding:"10px 14px",marginBottom:14,border:"1px solid #FDE68A"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:confArr.length>0?8:0}}>
          <span style={{fontSize:12,fontWeight:700,color:"#92400E"}}>👁 Seen by {confArr.length} user{confArr.length!==1?"s":""}</span>
          {myConf
            ?<span onClick={()=>removeConfirmation(ticket.id)} style={{fontSize:11,color:COLORS.slate,cursor:"pointer",textDecoration:"underline",marginLeft:4}}>Undo</span>
            :<Btn small variant="ghost" onClick={()=>addConfirmation(ticket.id)} style={{marginLeft:4}}>I've seen this too</Btn>}
        </div>
        {confArr.length>0&&<div style={{fontSize:11,color:"#92400E"}}>{confArr.map(c=>c.name).join(", ")}</div>}
      </div>

      {/* Photos */}
      {Object.keys(ticket.photos||{}).length>0&&<div style={{marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:700,color:COLORS.slate,marginBottom:8}}>Photos ({Object.keys(ticket.photos).length})</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {objArr(ticket.photos).map(p=>(
            <img key={p.id} src={p.dataUrl} onClick={()=>setLightbox(p.dataUrl)}
              style={{width:84,height:84,objectFit:"cover",borderRadius:8,cursor:"zoom-in",border:`1px solid ${COLORS.border}`}}/>
          ))}
        </div>
      </div>}

      {/* Owner note — owners/managers edit, all can read */}
      <div style={{background:"#EEF2FF",borderRadius:10,padding:"12px 14px",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <span style={{fontSize:12,fontWeight:700,color:COLORS.navy}}>📝 Owner Note</span>
          {isOwner&&editNoteId!==ticket.id&&<span onClick={()=>{setEditNoteId(ticket.id);setNoteText(ticket.note||"");}} style={{fontSize:11,color:COLORS.blue,cursor:"pointer",fontWeight:600}}>{ticket.note?"Edit":"Add Note"}</span>}
        </div>
        {editNoteId===ticket.id
          ?<div>
            <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Add a note visible to everyone…"
              style={{width:"100%",height:70,padding:"8px 10px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:12,resize:"vertical",boxSizing:"border-box"}}/>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <Btn small onClick={()=>saveNote(ticket.id)}>Save</Btn>
              <Btn small variant="ghost" onClick={()=>setEditNoteId(null)}>Cancel</Btn>
            </div>
          </div>
          :ticket.note
            ?<div>
              <div style={{fontSize:13,color:COLORS.navy,lineHeight:1.6}}>{ticket.note}</div>
              <div style={{fontSize:11,color:COLORS.slate,marginTop:4}}>— {ticket.noteBy} · {new Date(ticket.noteAt).toLocaleString()}</div>
            </div>
            :<div style={{fontSize:12,color:COLORS.slate,fontStyle:"italic"}}>{isOwner?"No note yet.":"No owner note yet."}</div>}
      </div>

      {/* Comments — all roles can add */}
      <div style={{background:COLORS.surface,borderRadius:10,padding:"12px 14px",marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:700,color:COLORS.navy,marginBottom:10}}>💬 Comments ({comments.length})</div>
        {comments.length>0&&<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
          {comments.map(c=>(
            <div key={c.id} style={{background:COLORS.white,borderRadius:8,padding:"8px 12px",border:`1px solid ${COLORS.border}`}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                <Avatar name={c.by} size={20}/>
                <span style={{fontSize:12,fontWeight:700,color:COLORS.navy}}>{c.by}</span>
                <span style={{fontSize:10,color:COLORS.slate}}>{new Date(c.at).toLocaleString()}</span>
              </div>
              <div style={{fontSize:13,color:COLORS.navy,lineHeight:1.5}}>{c.text}</div>
            </div>
          ))}
        </div>}
        <div style={{display:"flex",gap:8}}>
          <input value={commentText} onChange={e=>setCommentText(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();addComment(ticket.id);}}}
            placeholder="Add a comment…"
            style={{flex:1,padding:"8px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:13,outline:"none"}}/>
          <Btn small onClick={()=>addComment(ticket.id)} disabled={!commentText.trim()}>Post</Btn>
        </div>
      </div>

      {/* Status actions — owners/managers only */}
      {isOwner&&nextSt&&<Btn variant={nextSt==="resolved"?"green":"amber"} onClick={()=>updateStatus(ticket.id,nextSt)} style={{width:"100%",justifyContent:"center",marginBottom:8}}>
        → Mark as {maintStatusCfg[nextSt].label}
      </Btn>}
      {ticket.status==="resolved"&&<div style={{textAlign:"center",fontSize:13,color:COLORS.green,fontWeight:600,padding:"8px 0"}}>
        ✓ Resolved{ticket.resolvedAt?` on ${new Date(ticket.resolvedAt).toLocaleDateString()}`:""}
      </div>}
    </Modal>}

    {/* Lightbox */}
    {lightbox&&<div onClick={()=>setLightbox(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.93)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",cursor:"zoom-out"}}>
      <img src={lightbox} style={{maxWidth:"95vw",maxHeight:"88vh",objectFit:"contain",borderRadius:10}}/>
      <button onClick={()=>setLightbox(null)} style={{position:"absolute",top:16,right:20,background:"none",border:"none",color:"#fff",fontSize:32,cursor:"pointer",lineHeight:1}}>×</button>
    </div>}
  </div>;
}

// ─── FCM PUSH REGISTRATION ───────────────────────────────────────────────────
// Replace VAPID_KEY_HERE with the key from:
// Firebase Console → Project Settings → Cloud Messaging → Web configuration → Generate key pair
const FCM_VAPID_KEY = "VAPID_KEY_HERE";

async function registerFcmToken(accountId) {
  try {
    if (!("Notification" in window) || !navigator.serviceWorker) return;
    const permission = await Notification.requestPermission();
    if (permission !== "granted") return;
    const reg = await navigator.serviceWorker.register("/firebase-messaging-sw.js");
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) await _db.ref(`accounts/${accountId}/fcmToken`).set(token);
  } catch (e) { console.warn("FCM registration skipped:", e.message); }
}

function App() {
  const db                     = _db;
  const [currentUser, setUser] = useState(null);
  const [authScreen, setAuth]  = useState("login");
  const [sessChecked, setSessChecked] = useState(false);
  const [tab, setTab]          = useState("dashboard");
  const [section, setSection]  = useState("cleaning");

  // Real-time data from Firebase
  const [accounts,     setAccounts]   = useState([]);
  const [properties,   setProps]      = useState([]);
  const [jobs,         setJobs]       = useState([]);
  const [stays,        setStays]      = useState([]);
  const [inventory,    setInventory]  = useState([]);
  const [maintenance,    setMaintenance]  = useState([]);
  const [landscapeJobs,  setLandscape]    = useState([]);
  const [garbageJobs,    setGarbage]      = useState([]);
  const [toast,          setToast]        = useState(null);
  const [online,       setOnline]     = useState(true);
  const seenMaintIds = React.useRef(new Set());

  // Monitor connection state
  useEffect(() => {
    const ref = db.ref(".info/connected");
    ref.on("value", s => setOnline(s.val() === true));
    return () => ref.off();
  }, []);

  // Setup real-time listeners
  useEffect(() => {
    const r = {
      acc:   db.ref("accounts"),
      props: db.ref("properties"),
      jobs:  db.ref("jobs"),
      stays: db.ref("stays"),
      inv:   db.ref("inventory"),
      maint:     db.ref("maintenance"),
      landscape: db.ref("landscapeJobs"),
      garbage:   db.ref("garbageJobs"),
    };
    r.acc.on("value",       s => setAccounts(objArr(s.val())));
    r.landscape.on("value", s => setLandscape(objArr(s.val())));
    r.garbage.on("value",   s => setGarbage(objArr(s.val())));
    r.props.on("value",s => setProps(objArr(s.val())));
    r.jobs.on("value", s => setJobs(objArr(s.val())));
    r.stays.on("value",s => {
      const v=s.val()||{}; const arr=[];
      Object.values(v).forEach(p=>{ if(p) Object.values(p).forEach(st=>{ if(st) arr.push(st); }); });
      setStays(arr);
    });
    r.inv.on("value",  s => {
      const v=s.val()||{}; const arr=[];
      Object.values(v).forEach(p=>{ if(p) Object.values(p).forEach(it=>{ if(it) arr.push(it); }); });
      setInventory(arr);
    });
    r.maint.on("value",s => {
      const arr = objArr(s.val());
      setMaintenance(arr);
      // Toast for owners: fire on new tickets not yet seen
      const sess = loadSess();
      if (!sess) return;
      const newUrgent = arr.filter(t => !seenMaintIds.current.has(t.id) && t.urgency==="urgent" && t.status==="open");
      const newAny    = arr.filter(t => !seenMaintIds.current.has(t.id) && t.status==="open");
      arr.forEach(t => seenMaintIds.current.add(t.id));
      if (newUrgent.length>0) {
        setToast({msg:`🚨 Urgent: "${newUrgent[0].title}" — ${newUrgent[0].submittedBy}`,urgent:true});
        setTimeout(()=>setToast(null),7000);
      } else if (newAny.length>0) {
        setToast({msg:`🔧 New maintenance request: "${newAny[0].title}"`,urgent:false});
        setTimeout(()=>setToast(null),5000);
      }
    });
    // Session restore
    const sess = loadSess();
    if (sess) {
      r.acc.once("value", s => {
        const user = objArr(s.val()).find(a=>a.id===sess.userId);
        if (user) setUser(user);
        setSessChecked(true);
      });
    } else setSessChecked(true);
    return () => Object.values(r).forEach(ref=>ref.off());
  }, [db]);

  // Sync currentUser with live accounts (e.g. authorized status changed)
  useEffect(() => {
    if (!currentUser) return;
    const live = accounts.find(a=>a.id===currentUser.id);
    if (live) setUser(live);
  }, [accounts]);

  const handleLogin  = acc => {
    saveSess({userId:acc.id}); setUser(acc);
    setTab(["cleaner","landscaper","garbage"].includes(acc.role) ? "myjobs" : "dashboard");
    if (["cleaner","landscaper","garbage"].includes(acc.role)) registerFcmToken(acc.id);
  };
  const handleLogout = () => { clearSess(); setUser(null); setAuth("login"); setTab("dashboard"); };

  if (!sessChecked) return null;
  if (!currentUser) {
    return <DbCtx.Provider value={db}>
      {authScreen==="login"
        ?<LoginScreen onLogin={handleLogin} onGoSignup={()=>setAuth("signup")}/>
        :<SignupScreen onSignup={handleLogin} onGoLogin={()=>setAuth("login")}/>}
    </DbCtx.Provider>;
  }
  if (!currentUser.authorized) return <DbCtx.Provider value={db}><PendingScreen user={currentUser} onLogout={handleLogout}/></DbCtx.Provider>;

  const isCleaner    = currentUser.role==="cleaner";
  const isLandscaper = currentUser.role==="landscaper";
  const isGarbage    = currentUser.role==="garbage";
  const isWorker     = isCleaner || isLandscaper || isGarbage;
  const isOwner      = currentUser.role==="owner";
  const pendingCount = isOwner?accounts.filter(a=>!a.authorized&&a.role!=="owner").length:0;

  const maintOpen = maintenance.filter(t=>t.status!=="resolved");
  const maintBadge = isOwner ? maintOpen.length : maintenance.filter(t=>t.submittedById===currentUser.id&&t.status!=="resolved").length;
  const urgentBadge = isOwner && maintOpen.some(t=>t.urgency==="urgent");

  const myJobsBadge      = isCleaner    ? jobs.filter(j=>j.cleaner===currentUser.name&&j.status!=="complete").length : 0;
  const landscapeBadge   = isLandscaper ? landscapeJobs.filter(j=>j.worker===currentUser.name&&j.status!=="complete").length : 0;
  const garbageBadge     = isGarbage    ? garbageJobs.filter(j=>j.worker===currentUser.name&&j.status!=="complete").length : 0;

  const changeSection = s => { setSection(s); setTab("dashboard"); };

  const tabs = isLandscaper ? [
    {id:"myjobs", label:"My Jobs", icon:"🌿", badge:landscapeBadge},
  ] : isGarbage ? [
    {id:"myjobs", label:"My Jobs", icon:"🗑", badge:garbageBadge},
  ] : isCleaner ? [
    {id:"myjobs",       label:"My Jobs",      icon:"🧹", badge:myJobsBadge},
    {id:"calendar",     label:"Calendar",     icon:"📅"},
    {id:"inventory",    label:"Inventory",    icon:"📦"},
    {id:"maintenance",  label:"Maintenance",  icon:"🔧", badge:maintBadge},
  ] : section==="landscape" ? [
    {id:"dashboard",    label:"Dashboard",    icon:"🏠"},
    {id:"landscape",    label:"Landscape",    icon:"🌿"},
    ...(isOwner?[{id:"team",label:"Team",icon:"👥"}]:[]),
  ] : section==="garbage" ? [
    {id:"dashboard",    label:"Dashboard",    icon:"🏠"},
    {id:"garbage",      label:"Garbage",      icon:"🗑"},
    ...(isOwner?[{id:"team",label:"Team",icon:"👥"}]:[]),
  ] : [
    {id:"dashboard",    label:"Dashboard",    icon:"🏠"},
    {id:"calendar",     label:"Calendar",     icon:"📅"},
    {id:"sync",         label:"Sync",         icon:"🔄"},
    {id:"jobs",         label:"Jobs",         icon:"🧹"},
    {id:"maintenance",  label:"Maintenance",  icon:"🔧", badge:maintBadge, urgent:urgentBadge},
    {id:"inventory",    label:"Inventory",    icon:"📦"},
    ...(isOwner?[{id:"team",label:"Team",icon:"👥"}]:[]),
  ];

  return <DbCtx.Provider value={db}>
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');
      *{box-sizing:border-box;margin:0;padding:0;}
      body{font-family:'DM Sans',sans-serif;background:#EEF2FF;}
      @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
      @keyframes timerFlash{0%,100%{opacity:1}50%{opacity:0.25}}
      .timer-flash{animation:timerFlash 1s infinite}
      ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
      .fc{font-family:'DM Sans',sans-serif!important}
      .fc .fc-button-primary{background:#1B4FD8!important;border-color:#1B4FD8!important;font-family:'DM Sans',sans-serif!important;font-weight:600!important;font-size:12px!important;border-radius:8px!important;padding:6px 14px!important;text-transform:none!important;letter-spacing:0!important}
      .fc .fc-button-primary:not(:disabled):hover{background:#1539b8!important;border-color:#1539b8!important}
      .fc .fc-button-primary:not(:disabled).fc-button-active,.fc .fc-button-primary:not(:disabled).fc-button-active:hover{background:#0A1628!important;border-color:#0A1628!important}
      .fc .fc-button-primary:disabled{background:#94A3B8!important;border-color:#94A3B8!important}
      .fc .fc-toolbar-title{font-family:'DM Serif Display',serif!important;font-size:20px!important;color:#0A1628!important;font-weight:400!important}
      .fc .fc-col-header-cell-cushion{font-size:11px!important;font-weight:700!important;color:#64748B!important;text-decoration:none!important;text-transform:uppercase!important;letter-spacing:.6px!important}
      .fc .fc-daygrid-day-number{font-size:12px!important;color:#0A1628!important;font-weight:600!important;text-decoration:none!important;padding:4px 6px!important}
      .fc .fc-day-today{background:#EEF2FF!important}
      .fc .fc-event{border-radius:5px!important;cursor:pointer!important;border:none!important}
      .fc .fc-event:hover{filter:brightness(1.12)!important}
      .fc-ev-turnover{border-left:3px solid #F97316!important;padding-left:1px!important}
      .fc .fc-more-link{font-size:11px!important;color:#1B4FD8!important;font-weight:600!important;text-decoration:none!important}
      .fc td,.fc th{border-color:#E2E8F0!important}
      .fc .fc-scrollgrid{border-color:#E2E8F0!important}
      .fc .fc-list-event:hover td{background:#EEF2FF!important;cursor:pointer!important}
      .fc .fc-list-day-cushion{background:#F8FAFF!important;font-weight:700!important;font-size:12px!important}
      .fc .fc-daygrid-event-harness{margin-bottom:2px!important}
      .fc .fc-list-event-dot{border-color:inherit!important}
      @media(max-width:640px){.fc .fc-toolbar{flex-wrap:wrap;gap:6px}.fc .fc-toolbar-title{font-size:15px!important}.fc .fc-button-primary{font-size:11px!important;padding:5px 9px!important}}
    `}</style>

    <div style={{minHeight:"100vh",background:"#EEF2FF",fontFamily:FONT}}>
      {/* Nav */}
      <div style={{background:COLORS.white,borderBottom:`1px solid ${COLORS.border}`,padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,position:"sticky",top:0,zIndex:50,boxShadow:"0 1px 8px rgba(0,0,0,0.05)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:9,background:COLORS.navy,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{color:"#fff",fontSize:14,fontWeight:800}}>B</span>
          </div>
          <div>
            <div style={{fontWeight:800,fontSize:14,color:COLORS.navy,fontFamily:DISPLAY}}>Bluerock</div>
            <div style={{fontSize:10,color:COLORS.slate,marginTop:-2}}>Property Management</div>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:online?COLORS.green:"#F59E0B"}} title={online?"Real-time sync active":"Offline — changes will sync when reconnected"}/>
          {isOwner&&pendingCount>0&&<div onClick={()=>setTab("team")} title={`${pendingCount} pending`} style={{width:22,height:22,borderRadius:"50%",background:COLORS.red,color:"#fff",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>{pendingCount}</div>}
          <Avatar name={currentUser.name} size={30}/>
          <div style={{lineHeight:1.2}}>
            <div style={{fontSize:12,fontWeight:700,color:COLORS.navy}}>{currentUser.name}</div>
            <div style={{fontSize:10,color:COLORS.slate,textTransform:"capitalize"}}>{currentUser.role==="owner"?"Owner":currentUser.role==="manager"?"Manager":currentUser.role==="landscaper"?"Landscaper":currentUser.role==="garbage"?"Garbage Collector":"Cleaner"}</div>
          </div>
          <button onClick={handleLogout} style={{background:"none",border:`1.5px solid ${COLORS.border}`,borderRadius:8,padding:"5px 12px",cursor:"pointer",fontFamily:FONT,fontSize:12,color:COLORS.slate,fontWeight:600}}>Sign out</button>
        </div>
      </div>

      {/* Offline banner */}
      {!online&&<div style={{background:"#92400E",color:"#fff",textAlign:"center",padding:"8px 16px",fontSize:13,fontWeight:600}}>
        📡 No internet connection — your changes are saved and will sync automatically when you're back online.
      </div>}

      {/* Toast notification */}
      {toast&&isOwner&&<div style={{position:"fixed",top:68,left:"50%",transform:"translateX(-50%)",zIndex:99,background:toast.urgent?"#991B1B":COLORS.navy,color:"#fff",padding:"12px 20px",borderRadius:12,fontSize:13,fontWeight:600,boxShadow:"0 4px 20px rgba(0,0,0,0.25)",display:"flex",alignItems:"center",gap:12,maxWidth:460,width:"calc(100% - 40px)",animation:"slideUp 0.2s ease"}}>
        <span style={{flex:1}}>{toast.msg}</span>
        <button onClick={()=>setToast(null)} style={{background:"none",border:"none",color:"rgba(255,255,255,0.7)",cursor:"pointer",fontSize:18,lineHeight:1,padding:0}}>×</button>
      </div>}

      {/* Content */}
      <div style={{maxWidth:tab==="calendar"?1100:860,margin:"0 auto",padding:"24px 20px"}}>
        {!isWorker&&<div style={{display:"flex",gap:6,marginBottom:16,background:COLORS.white,padding:"6px 8px",borderRadius:14,border:`1px solid ${COLORS.border}`,width:"fit-content",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
          {[
            {id:"cleaning",  label:"Cleaning",    icon:"🧹"},
            {id:"landscape", label:"Landscaping", icon:"🌿"},
            {id:"garbage",   label:"Garbage",     icon:"🗑"},
          ].map(s=>(
            <button key={s.id} onClick={()=>changeSection(s.id)} style={{
              padding:"7px 18px",borderRadius:9,border:"none",cursor:"pointer",
              fontFamily:FONT,fontSize:13,fontWeight:600,transition:"all 0.15s",
              background:section===s.id?COLORS.navy:"transparent",
              color:section===s.id?"#fff":COLORS.slate,
            }}>{s.icon} {s.label}</button>
          ))}
        </div>}
        <Tabs tabs={tabs} active={tab} onChange={setTab}/>
        {tab==="myjobs"     &&isCleaner   &&<MyJobsView jobs={jobs} properties={properties} currentUser={currentUser}/>}
        {tab==="myjobs"     &&isLandscaper&&<WorkerScheduleView jobs={landscapeJobs.filter(j=>j.worker===currentUser.name)} jobType="landscape" currentUser={currentUser} properties={properties}/>}
        {tab==="myjobs"     &&isGarbage   &&<WorkerScheduleView jobs={garbageJobs.filter(j=>j.worker===currentUser.name)} jobType="garbage" currentUser={currentUser} properties={properties}/>}
        {tab==="dashboard"  &&!isWorker&&<DashboardView jobs={jobs} inventory={inventory} properties={properties} currentUser={currentUser} stays={stays} maintenance={maintenance}/>}
        {tab==="calendar"  &&<OpsCalendarView stays={stays} properties={properties} jobs={jobs} currentUser={currentUser} accounts={accounts}/>}
        {tab==="sync"      &&!isWorker&&<CalendarView stays={stays} jobs={jobs} properties={properties} accounts={accounts} currentUser={currentUser} readOnly={false}/>}
        {tab==="jobs"      &&!isWorker&&<JobsView jobs={jobs} properties={properties} accounts={accounts} currentUser={currentUser}/>}
        {tab==="landscape"  &&!isWorker&&<ScheduleManagerView jobs={landscapeJobs} jobType="landscape" accounts={accounts} properties={properties} currentUser={currentUser}/>}
        {tab==="garbage"    &&!isWorker&&<ScheduleManagerView jobs={garbageJobs} jobType="garbage" accounts={accounts} properties={properties} currentUser={currentUser}/>}
        {tab==="maintenance"&&<MaintenanceView maintenance={maintenance} properties={properties} currentUser={currentUser}/>}
        {tab==="inventory"  &&<InventoryView inventory={inventory} properties={properties} currentUser={currentUser}/>}
        {tab==="team"       &&isOwner&&<TeamView currentUser={currentUser} accounts={accounts} section={section}/>}
      </div>
    </div>
  </DbCtx.Provider>;
}

// ─── JOBS VIEW ────────────────────────────────────────────────────────────────
function JobsView({jobs,properties,accounts,currentUser}) {
  const db = useContext(DbCtx);
  const [filter,setFilter]=useState("all");
  const [showModal,setShowModal]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [newJob,setNewJob]=useState({propertyId:"",checkoutDate:"",checkinDate:"",cleaner:""});
  const cleaners = accounts.filter(a=>a.authorized&&(a.role==="cleaner"||a.role==="manager"||a.role==="owner")).map(a=>a.name);
  const filtered = filter==="all"?jobs:jobs.filter(j=>j.status===filter);
  const sorted = filtered.slice().sort((a,b)=>a.checkoutDate.localeCompare(b.checkoutDate));

  const updateStatus = async (jobId,newStatus) => {
    const now = new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    if (newStatus==="in-progress") await db.ref(`jobs/${jobId}`).update({status:"in-progress",arrivedAt:now});
    if (newStatus==="complete")    await db.ref(`jobs/${jobId}`).update({status:"complete",completedAt:now});
    setShowModal(null);
  };
  const assignCleaner = async (jobId,cleaner) => {
    await db.ref(`jobs/${jobId}`).update({cleaner:cleaner||null});
  };
  const addJob = async () => {
    if (!newJob.propertyId||!newJob.checkoutDate) return;
    const id = String(Date.now());
    await db.ref(`jobs/${id}`).set({id,propertyId:newJob.propertyId,checkoutDate:newJob.checkoutDate,checkinDate:newJob.checkinDate||null,status:"pending",cleaner:newJob.cleaner||null,arrivedAt:null,completedAt:null,photos:0});
    setShowNew(false); setNewJob({propertyId:"",checkoutDate:"",checkinDate:"",cleaner:""});
  };

  return <div>
    <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
      {["all","pending","in-progress","complete"].map(f=>(
        <button key={f} onClick={()=>setFilter(f)} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:FONT,fontSize:12,fontWeight:600,background:filter===f?COLORS.blue:COLORS.sky,color:filter===f?"#fff":COLORS.slate}}>
          {f==="all"?"All":jobStatusCfg[f].label}
        </button>
      ))}
      <div style={{flex:1}}/>
      {properties.length>0&&<Btn small onClick={()=>setShowNew(true)}>+ New Job</Btn>}
    </div>

    {sorted.length===0?<div style={{textAlign:"center",padding:"40px 0",color:COLORS.slate,fontSize:14}}>
      {jobs.length===0?"No jobs yet. Sync an iCal in the Calendar tab.":"No jobs in this category."}
    </div>:<div style={{display:"flex",flexDirection:"column",gap:12}}>
      {sorted.map(job=>{
        const prop=getProp(job.propertyId,properties);
        return <Card key={job.id} onClick={()=>setShowModal(job)} style={{padding:"16px 20px"}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:4,height:56,borderRadius:4,background:prop.color,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <span style={{fontWeight:700,fontSize:15,color:COLORS.navy}}>{prop.name}</span>
                <Badge config={jobStatusCfg[job.status]} small/>
                {!job.cleaner&&<span style={{fontSize:11,color:COLORS.amber,fontWeight:600}}>Unassigned</span>}
              </div>
              <div style={{fontSize:12,color:COLORS.slate,marginBottom:3}}>Checkout: {fmtDate(job.checkoutDate)}{job.checkinDate?` → Check-in: ${fmtDate(job.checkinDate)}`:""}</div>
              <div style={{fontSize:12,color:COLORS.slate,display:"flex",gap:12}}>
                {job.cleaner&&<span>👤 {job.cleaner}</span>}
                {job.arrivedAt&&<span>🕐 Arrived {job.arrivedAt}</span>}
                {job.completedAt&&<span>✓ Done {job.completedAt}</span>}
              </div>
            </div>
            <span style={{color:COLORS.slate,fontSize:18}}>›</span>
          </div>
        </Card>;
      })}
    </div>}

    {showModal&&<Modal onClose={()=>setShowModal(null)}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <div style={{width:14,height:14,borderRadius:"50%",background:getProp(showModal.propertyId,properties).color}}/>
          <h3 style={{fontFamily:DISPLAY,fontSize:20,color:COLORS.navy,margin:0}}>{getProp(showModal.propertyId,properties).name}</h3>
          <Badge config={jobStatusCfg[showModal.status]}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          {[["Checkout",fmtDate(showModal.checkoutDate)],["Check-in",showModal.checkinDate?fmtDate(showModal.checkinDate):"TBD"],["Arrived",showModal.arrivedAt||"—"],["Completed",showModal.completedAt||"—"]].map(([l,v])=>(
            <div key={l} style={{background:COLORS.surface,borderRadius:10,padding:"10px 14px"}}>
              <div style={{fontSize:11,color:COLORS.slate,marginBottom:2}}>{l}</div>
              <div style={{fontSize:13,fontWeight:600,color:COLORS.navy}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{background:COLORS.surface,borderRadius:10,padding:"10px 14px",marginBottom:14}}>
          <div style={{fontSize:11,color:COLORS.slate,marginBottom:2}}>Assigned Cleaner</div>
          <div style={{fontSize:13,fontWeight:600,color:showModal.cleaner?COLORS.navy:COLORS.slate}}>{showModal.cleaner||"Unassigned — waiting for a cleaner to claim"}</div>
        </div>
        {showModal.status==="pending"&&<Btn variant="amber" onClick={()=>updateStatus(showModal.id,"in-progress")} style={{width:"100%",justifyContent:"center",marginBottom:8}}>🕐 Mark In Progress</Btn>}
        {showModal.status==="in-progress"&&<Btn variant="green" onClick={()=>updateStatus(showModal.id,"complete")} style={{width:"100%",justifyContent:"center",marginBottom:8}}>✓ Mark Complete</Btn>}
      </div>
    </Modal>}

    {showNew&&<Modal onClose={()=>setShowNew(false)}>
      <h3 style={{fontFamily:DISPLAY,fontSize:20,color:COLORS.navy,marginBottom:20}}>Create New Job</h3>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {[{l:"Property",f:"propertyId",type:"select",opts:properties.map(p=>({v:p.id,l:p.name}))},{l:"Checkout Date",f:"checkoutDate",type:"date"},{l:"Check-in Date (optional)",f:"checkinDate",type:"date"}].map(({l,f,type,opts})=>(
          <div key={f}>
            <label style={{fontSize:12,fontWeight:600,color:COLORS.slate,display:"block",marginBottom:4}}>{l}</label>
            {type==="select"
              ?<select value={newJob[f]} onChange={e=>setNewJob(p=>({...p,[f]:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:13}}>
                <option value="">Select…</option>
                {(opts||[]).map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
              </select>
              :<input type={type} value={newJob[f]} onChange={e=>setNewJob(p=>({...p,[f]:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontFamily:FONT,fontSize:13,boxSizing:"border-box"}}/>}
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:10,marginTop:20}}>
        <Btn onClick={addJob} disabled={!newJob.propertyId||!newJob.checkoutDate}>Create Job</Btn>
        <Btn variant="ghost" onClick={()=>setShowNew(false)}>Cancel</Btn>
      </div>
    </Modal>}
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
